<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Waypoint</title>
<link rel="stylesheet" href="auth-booking.css">
</head>
<body>

  <header class="nav">
    <a href="index.html" class="brand">Waypoint</a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="destinations.html">Destinations</a></li>
        <li><a href="itinerary.html">Plan a Trip</a></li>
        <li><a href="login.html" class="btn-nav active-nav">Log in</a></li>
      </ul>
    </nav>
  </header>

  <section class="auth-wrap">
    <div class="auth-card">
      <div class="auth-tabs">
        <span class="tab active">Log in</span>
        <span class="tab">Sign up</span>
      </div>

      <form class="auth-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••">
        </div>
        <label class="remember">
          <input type="checkbox"> Keep me signed in on this device
        </label>
        <button type="submit" class="btn-primary full">Log in</button>
      </form>

      <p class="auth-note">
        Demo login for coursework — checked against a bundled sample
        account list, not a live authentication service.
      </p>
    </div>
  </section>

  <footer class="site-footer">
    <p>Waypoint — a student project, GLA University.</p>
    <p>Om Singh · Nishant Prajapati · Palak Kamra · Naveen Yadav</p>
  </footer>

</body>
</html>
